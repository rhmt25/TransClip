[package]
name = "transclip"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "transclip"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
engine = { version = "0.1.0", path = "../crates/engine" }
proto = { version = "0.1.0", path = "../crates/proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Memory", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
zeroize = "1.9.2"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "transclip"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "transclip"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
engine = { version = "1.1.1", path = "../crates/engine" }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "jpeg"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
proto = { version = "1.1.1", path = "../crates/proto" }
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.18.0"
rqrr = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Memory", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Devices_Bluetooth", "Devices_Bluetooth_Rfcomm", "Devices_Enumeration", "Networking_Sockets", "Networking", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices"] }
windows-core = "0.62"
zeroize = "1.9.2"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "proto"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "time", "sync", "rt", "macros"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros", "io-util", "time", "net"] }

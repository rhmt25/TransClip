[workspace]
resolver = "2"
members = ["crates/proto", "crates/engine", "crates/tvgen", "app"]

[workspace.package]
version = "1.1.1"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
